version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careeriz}
      POSTGRES_USER: ${POSTGRES_USER:-careeriz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careeriz}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careeriz} -d ${POSTGRES_DB:-careeriz}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  opensearch:
    profiles: ["opensearch-local"]
    image: opensearchproject/opensearch:3.5.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1024m -Xmx1024m"
      bootstrap.memory_lock: "true"
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
    mem_limit: 2g
    cpus: 1.5
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - ./backend/opensearch/analysis:/usr/share/opensearch/config/analysis:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://careeriz:careeriz@postgres:5432/careeriz?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://careeriz:careeriz@postgres:5432/careeriz?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-character-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      API_BODY_LIMIT_MB: ${API_BODY_LIMIT_MB:-5}
      FILE_UPLOAD_MAX_MB: ${FILE_UPLOAD_MAX_MB:-5}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
      REDIS_ENABLED: "true"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-careeriz}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-resumes}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-./storage/resumes}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@careeriz.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESUME_BUILDER_ENABLED: ${RESUME_BUILDER_ENABLED:-false}
      RESUME_BUILDER_BASE_URL: ${RESUME_BUILDER_BASE_URL:-}
      RESUME_BUILDER_CLIENT_ID: ${RESUME_BUILDER_CLIENT_ID:-}
      INTELLIGENCE_ENABLED: ${INTELLIGENCE_ENABLED:-false}
      INTELLIGENCE_PROVIDER: ${INTELLIGENCE_PROVIDER:-DISABLED}
      INTELLIGENCE_MODEL: ${INTELLIGENCE_MODEL:-}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY:-}
      INTELLIGENCE_BASE_URL: ${INTELLIGENCE_BASE_URL:-}
      INTELLIGENCE_TIMEOUT_MS: ${INTELLIGENCE_TIMEOUT_MS:-20000}
      INTELLIGENCE_MAX_RETRIES: ${INTELLIGENCE_MAX_RETRIES:-1}
      INTELLIGENCE_MAX_INPUT_CHARS: ${INTELLIGENCE_MAX_INPUT_CHARS:-30000}
      INTELLIGENCE_MAX_OUTPUT_TOKENS: ${INTELLIGENCE_MAX_OUTPUT_TOKENS:-1200}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_SCHEDULER_INTERVAL_MS: ${WORKER_SCHEDULER_INTERVAL_MS:-30000}
      TASK_RETENTION_DAYS: ${TASK_RETENTION_DAYS:-30}
      DOCUMENT_PROCESSOR_ENABLED: ${DOCUMENT_PROCESSOR_ENABLED:-false}
      DOCUMENT_PROCESSOR_URL: ${DOCUMENT_PROCESSOR_URL:-http://document-processor:8081}
      DOCUMENT_PROCESSOR_CONNECT_TIMEOUT_MS: ${DOCUMENT_PROCESSOR_CONNECT_TIMEOUT_MS:-3000}
      DOCUMENT_PROCESSOR_RESPONSE_TIMEOUT_MS: ${DOCUMENT_PROCESSOR_RESPONSE_TIMEOUT_MS:-120000}
      DOCUMENT_PROCESSOR_MAX_RETRIES: ${DOCUMENT_PROCESSOR_MAX_RETRIES:-1}
      DOCUMENT_PROCESSOR_CIRCUIT_BREAKER_THRESHOLD: ${DOCUMENT_PROCESSOR_CIRCUIT_BREAKER_THRESHOLD:-5}
      DOCUMENT_PROCESSOR_CIRCUIT_BREAKER_COOLDOWN_MS: ${DOCUMENT_PROCESSOR_CIRCUIT_BREAKER_COOLDOWN_MS:-30000}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 10
    volumes:
      - resume_storage:/app/backend/storage/resumes

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://careeriz:careeriz@postgres:5432/careeriz?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://careeriz:careeriz@postgres:5432/careeriz?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-character-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      API_BODY_LIMIT_MB: ${API_BODY_LIMIT_MB:-5}
      FILE_UPLOAD_MAX_MB: ${FILE_UPLOAD_MAX_MB:-5}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
      REDIS_ENABLED: "true"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-careeriz}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-resumes}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-./storage/resumes}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@careeriz.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESUME_BUILDER_ENABLED: ${RESUME_BUILDER_ENABLED:-false}
      RESUME_BUILDER_BASE_URL: ${RESUME_BUILDER_BASE_URL:-}
      RESUME_BUILDER_CLIENT_ID: ${RESUME_BUILDER_CLIENT_ID:-}
      INTELLIGENCE_ENABLED: ${INTELLIGENCE_ENABLED:-false}
      INTELLIGENCE_PROVIDER: ${INTELLIGENCE_PROVIDER:-DISABLED}
      INTELLIGENCE_MODEL: ${INTELLIGENCE_MODEL:-}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY:-}
      INTELLIGENCE_BASE_URL: ${INTELLIGENCE_BASE_URL:-}
      INTELLIGENCE_TIMEOUT_MS: ${INTELLIGENCE_TIMEOUT_MS:-20000}
      INTELLIGENCE_MAX_RETRIES: ${INTELLIGENCE_MAX_RETRIES:-1}
      INTELLIGENCE_MAX_INPUT_CHARS: ${INTELLIGENCE_MAX_INPUT_CHARS:-30000}
      INTELLIGENCE_MAX_OUTPUT_TOKENS: ${INTELLIGENCE_MAX_OUTPUT_TOKENS:-1200}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_SCHEDULER_INTERVAL_MS: ${WORKER_SCHEDULER_INTERVAL_MS:-30000}
      TASK_RETENTION_DAYS: ${TASK_RETENTION_DAYS:-30}
      DOCUMENT_PROCESSOR_ENABLED: ${DOCUMENT_PROCESSOR_ENABLED:-false}
      DOCUMENT_PROCESSOR_URL: ${DOCUMENT_PROCESSOR_URL:-http://document-processor:8081}
      DOCUMENT_PROCESSOR_CONNECT_TIMEOUT_MS: ${DOCUMENT_PROCESSOR_CONNECT_TIMEOUT_MS:-3000}
      DOCUMENT_PROCESSOR_RESPONSE_TIMEOUT_MS: ${DOCUMENT_PROCESSOR_RESPONSE_TIMEOUT_MS:-120000}
      DOCUMENT_PROCESSOR_MAX_RETRIES: ${DOCUMENT_PROCESSOR_MAX_RETRIES:-1}
      DOCUMENT_PROCESSOR_CIRCUIT_BREAKER_THRESHOLD: ${DOCUMENT_PROCESSOR_CIRCUIT_BREAKER_THRESHOLD:-5}
      DOCUMENT_PROCESSOR_CIRCUIT_BREAKER_COOLDOWN_MS: ${DOCUMENT_PROCESSOR_CIRCUIT_BREAKER_COOLDOWN_MS:-30000}
    volumes:
      - resume_storage:/app/backend/storage/resumes

  document-processor:
    build:
      context: ./document-processor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8081
      MAX_CONCURRENT_REQUESTS: ${DOCPROC_MAX_CONCURRENT_REQUESTS:-2}
      MAX_FILE_SIZE_MB: ${DOCPROC_MAX_FILE_SIZE_MB:-15}
      MAX_PAGE_COUNT: ${DOCPROC_MAX_PAGE_COUNT:-50}
      DOCLING_ENABLED: ${DOCPROC_DOCLING_ENABLED:-false}
      PADDLEOCR_ENABLED: ${DOCPROC_PADDLEOCR_ENABLED:-false}
      PREPROCESSING_ENABLED: ${DOCPROC_PREPROCESSING_ENABLED:-false}
      GPU_ENABLED: "false"
      LOG_LEVEL: ${DOCPROC_LOG_LEVEL:-INFO}
      # Step 4.5: Docling worker pool lifecycle. See
      # docs/document-processor.md for the measurement these are based on.
      DOCLING_CONVERSION_TIMEOUT_SECONDS: ${DOCPROC_CONVERSION_TIMEOUT_SECONDS:-45}
      DOCLING_QUEUE_CAPACITY: ${DOCPROC_QUEUE_CAPACITY:-1}
      DOCLING_WORKER_MAX_DOCUMENTS: ${DOCPROC_WORKER_MAX_DOCUMENTS:-50}
      DOCLING_WORKER_MAX_RSS_MB: ${DOCPROC_WORKER_MAX_RSS_MB:-2200}
      DOCLING_WARMUP_TIMEOUT_SECONDS: ${DOCPROC_WARMUP_TIMEOUT_SECONDS:-150}
      # Step 6: OCR worker pool -- a SEPARATE process from Docling's (see
      # app/worker/instance.py), with its own timeout/queue/RSS policy.
      # OCR_WORKER_MAX_RSS_MB is a provisional estimate, NOT measured
      # (real paddleocr could not run in the dev sandbox this was written
      # in -- see docs/document-processor.md's Step 6 dependency-gate
      # section) -- re-measure for real before treating it as final.
      OCR_CONVERSION_TIMEOUT_SECONDS: ${DOCPROC_OCR_CONVERSION_TIMEOUT_SECONDS:-60}
      OCR_QUEUE_CAPACITY: ${DOCPROC_OCR_QUEUE_CAPACITY:-1}
      OCR_WORKER_MAX_DOCUMENTS: ${DOCPROC_OCR_WORKER_MAX_DOCUMENTS:-50}
      OCR_WORKER_MAX_RSS_MB: ${DOCPROC_OCR_WORKER_MAX_RSS_MB:-1800}
      OCR_WARMUP_TIMEOUT_SECONDS: ${DOCPROC_OCR_WARMUP_TIMEOUT_SECONDS:-300}
      OCR_LANGUAGE: ${DOCPROC_OCR_LANGUAGE:-en}
      # Points PaddleX's model cache at a path that can be pre-baked into
      # the image or bind-mounted, so warm-up never depends on a network
      # download at container start in a locked-down deployment. Unset by
      # default (falls through to PaddleX's own default cache location).
      PADDLEOCR_MODEL_DIR: ${DOCPROC_PADDLEOCR_MODEL_DIR:-}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health/live', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Docling worker: measured for real (Step 4 closure + Step 4.5
    # worker-lifecycle measurement, see docs/document-processor.md) --
    # sits at ~1.05GB RSS right after warm-up, grows ~15-19MB per
    # conversion (5 sequential real conversions: 1199 -> 1265MB), peak
    # ~1.57GB observed mid-conversion, worst case ~2.6-2.7GB before
    # recycling kicks in.
    #
    # OCR worker (Step 6): NOT measured for real -- paddleocr/paddlepaddle
    # could not be run in the dev sandbox this was written in (no Python
    # 3.11/Docker locally; see docs/document-processor.md's Step 6
    # dependency-gate section). Estimated from paddlepaddle's own ~195MB
    # installed wheel size plus commonly-reported CPU inference RSS for
    # PaddleOCR's full pipeline (several hundred MB to ~1.5GB across
    # public reports) -- treat as a rough upper bound, not a measurement.
    #
    # Step 6 changed the sizing question itself: Docling and OCR now run
    # as two INDEPENDENT worker pools that can genuinely be busy at the
    # same time (unlike Step 5's single shared pool, where only one heavy
    # job ever ran at once across every engine) -- so this container's
    # memory budget must now cover BOTH pools' peaks simultaneously, not
    # just one. 6g/3cpu is a provisional estimate (Docling's real ~2.7GB
    # worst case + OCR's estimated ~1.8GB ceiling + parent/OS overhead,
    # with headroom) -- MUST be re-measured for real (Linux/Python 3.11,
    # real paddleocr, production-scale documents) before being treated as
    # final. If real measurement shows the combined footprint is large
    # relative to available host memory, or the two pools need
    # independently tunable resource limits/scaling, prefer splitting
    # docling and ocr into SEPARATE containers/services over continuing to
    # grow this one shared limit -- the two-pool code already isolates
    # them at the process level, so that split would be a deployment
    # change, not a code change. A future GPU variant must be a separate
    # Dockerfile/service, never toggled via env var alone on this CPU image.
    mem_limit: 6g
    cpus: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
      BACKEND_API_BASE_URL: http://backend:5000/api
      OAUTH_PUBLIC_BASE_URL: http://localhost:5000
      NEXT_PUBLIC_APP_NAME: Careeriz
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  elastic_data:
  opensearch_data:
  resume_storage:
