version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careeriz}
      POSTGRES_USER: ${POSTGRES_USER:-careeriz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careeriz}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careeriz} -d ${POSTGRES_DB:-careeriz}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://careeriz:careeriz@postgres:5432/careeriz?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://careeriz:careeriz@postgres:5432/careeriz?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-character-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      API_BODY_LIMIT_MB: ${API_BODY_LIMIT_MB:-5}
      FILE_UPLOAD_MAX_MB: ${FILE_UPLOAD_MAX_MB:-5}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
      REDIS_ENABLED: "true"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-careeriz}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-resumes}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-./storage/resumes}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@careeriz.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESUME_BUILDER_ENABLED: ${RESUME_BUILDER_ENABLED:-false}
      RESUME_BUILDER_BASE_URL: ${RESUME_BUILDER_BASE_URL:-}
      RESUME_BUILDER_CLIENT_ID: ${RESUME_BUILDER_CLIENT_ID:-}
      INTELLIGENCE_ENABLED: ${INTELLIGENCE_ENABLED:-false}
      INTELLIGENCE_PROVIDER: ${INTELLIGENCE_PROVIDER:-DISABLED}
      INTELLIGENCE_MODEL: ${INTELLIGENCE_MODEL:-}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY:-}
      INTELLIGENCE_BASE_URL: ${INTELLIGENCE_BASE_URL:-}
      INTELLIGENCE_TIMEOUT_MS: ${INTELLIGENCE_TIMEOUT_MS:-20000}
      INTELLIGENCE_MAX_RETRIES: ${INTELLIGENCE_MAX_RETRIES:-1}
      INTELLIGENCE_MAX_INPUT_CHARS: ${INTELLIGENCE_MAX_INPUT_CHARS:-30000}
      INTELLIGENCE_MAX_OUTPUT_TOKENS: ${INTELLIGENCE_MAX_OUTPUT_TOKENS:-1200}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_SCHEDULER_INTERVAL_MS: ${WORKER_SCHEDULER_INTERVAL_MS:-30000}
      TASK_RETENTION_DAYS: ${TASK_RETENTION_DAYS:-30}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 10
    volumes:
      - resume_storage:/app/backend/storage/resumes

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://careeriz:careeriz@postgres:5432/careeriz?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://careeriz:careeriz@postgres:5432/careeriz?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-character-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      API_BODY_LIMIT_MB: ${API_BODY_LIMIT_MB:-5}
      FILE_UPLOAD_MAX_MB: ${FILE_UPLOAD_MAX_MB:-5}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
      REDIS_ENABLED: "true"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-careeriz}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-resumes}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-./storage/resumes}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@careeriz.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESUME_BUILDER_ENABLED: ${RESUME_BUILDER_ENABLED:-false}
      RESUME_BUILDER_BASE_URL: ${RESUME_BUILDER_BASE_URL:-}
      RESUME_BUILDER_CLIENT_ID: ${RESUME_BUILDER_CLIENT_ID:-}
      INTELLIGENCE_ENABLED: ${INTELLIGENCE_ENABLED:-false}
      INTELLIGENCE_PROVIDER: ${INTELLIGENCE_PROVIDER:-DISABLED}
      INTELLIGENCE_MODEL: ${INTELLIGENCE_MODEL:-}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY:-}
      INTELLIGENCE_BASE_URL: ${INTELLIGENCE_BASE_URL:-}
      INTELLIGENCE_TIMEOUT_MS: ${INTELLIGENCE_TIMEOUT_MS:-20000}
      INTELLIGENCE_MAX_RETRIES: ${INTELLIGENCE_MAX_RETRIES:-1}
      INTELLIGENCE_MAX_INPUT_CHARS: ${INTELLIGENCE_MAX_INPUT_CHARS:-30000}
      INTELLIGENCE_MAX_OUTPUT_TOKENS: ${INTELLIGENCE_MAX_OUTPUT_TOKENS:-1200}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_SCHEDULER_INTERVAL_MS: ${WORKER_SCHEDULER_INTERVAL_MS:-30000}
      TASK_RETENTION_DAYS: ${TASK_RETENTION_DAYS:-30}
    volumes:
      - resume_storage:/app/backend/storage/resumes

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000/api}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Careeriz}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  elastic_data:
  resume_storage:
